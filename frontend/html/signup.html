<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Registro - Solicitar Acceso</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="contenedorPrincipal">
    <div class="panelIzquierdo">
      <h1 class="titulo">Iniciemos</h1>
      <p class="subtitulo">
        ¿Ya tienes cuenta?
        <a href="login.html">Inicia Sesión</a>
      </p>

      <form class="formulario" novalidate>
        <div class="grupoCampo">
          <label for="username">Nombre de usuario</label>
          <div class="inputIcono">
            <span class="icono">👤</span>
            <input 
              type="text" 
              id="username"
              placeholder="Nombre de usuario"
              required
              minlength="3"
            >
          </div>
        </div>

        <div class="grupoCampo">
          <label for="userType">Tipo de usuario</label>
          <div class="inputIcono">
            <span class="icono">🪪</span>
            <select id="userType" required>
              <option selected disabled value="">Seleccione tipo de usuario</option>
              <option value="admin">Administrador</option>
              <option value="cuidador">Cuidador</option>
              <option value="paciente">Paciente</option>
            </select>
          </div>
        </div>

        <div class="grupoDoble">
          <div class="grupoCampo">
            <label for="birthDate">Fecha de Nacimiento</label>
            <div class="inputIcono">
              <span class="icono">🗓️</span>
              <input 
                type="text" 
                id="birthDate"
                placeholder="dd-mm-yyyy"
                required
              >
            </div>
          </div>

          <div class="grupoCampo">
            <label for="phone">Número de teléfono</label>
            <div class="inputIcono">
              <span class="icono">📱</span>
              <input 
                type="text" 
                id="phone"
                placeholder="Número de teléfono"
                required
              >
            </div>
          </div>
        </div>

        <div class="grupoCampo">
          <label for="password">Contraseña</label>
          <div class="inputIcono">
            <span class="icono">🔒</span>
            <input 
              type="password" 
              id="password" 
              placeholder="Ingrese Contraseña (10-32 caracteres)"
              required
              minlength="10"
              maxlength="32"
            >
            <span class="togglePassword" onclick="mostrarPassword()">👁️</span>
          </div>
        </div>

        <div class="botonContenedor">
          <button type="submit" class="boton">Solicitar Acceso</button>
        </div>
      </form>
    </div>

    <div class="panelDerecho">
      <div class="controlesVentana">
        <span>–</span>
        <span>□</span>
        <span>×</span>
      </div>
    </div>
  </div>

  <script src="../js/script.js"></script>
</body>
</html>
