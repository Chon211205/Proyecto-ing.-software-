<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Iniciar Sesión</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&display=swap" rel="stylesheet">
  
  <link rel="stylesheet" href="../css/styles.css">
</head>
<body>
  <div class="contenedorPrincipal">
    <div class="panelIzquierdo">
      <h1 class="titulo">Inicia Sesión</h1>
      <p class="subtitulo">
        ¿No tienes cuenta?
        <a href="signup.html">Solicitar Cuenta</a>
      </p>

      <form class="formulario" novalidate>
        <div class="grupoCampo">
          <label for="username">Usuario</label>
          <div class="inputIcono">
            <span class="icono">👤</span>
            <input 
              type="text" 
              id="username"
              placeholder="Ingrese Usuario"
              required
              minlength="3"
            >
          </div>
        </div>

        <div class="grupoCampo">
          <label for="password">Contraseña</label>
          <div class="inputIcono">
            <span class="icono">🔒</span>
            <input 
              type="password" 
              id="password" 
              placeholder="Ingrese Contraseña"
              required
              minlength="10"
            >
            <span class="togglePassword" onclick="mostrarPassword()">👁️</span>
          </div>
        </div>

        <div class="botonContenedor">
          <button type="submit" class="boton">Iniciar Sesión</button>
        </div>
      </form>

      <p class="enlaceOlvide">
        <a href="recuperar-contrasena.html">¿Olvidaste tu contraseña?</a>
      </p>
    </div>

    <div class="panelDerecho">
      <div class="controlesVentana">
        <span>–</span>
        <span>□</span>
        <span>×</span>
      </div>
    </div>
  </div>

  <script src="../js/script.js"></script>
  <script src="../js/login.js"></script>
</body>
</html>
